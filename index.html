<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0D1117" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <!-- 開機骨架：JS 下載、登入狀態確認期間先顯示，Vue 掛載後被取代（main.js 等路由就緒才掛載）。
         版面比照 AppHeader＋清單頁的骨架（TransactionList、SummaryCards、CategoryBreakdown）；那邊改版面時這裡要一起改。
         色塊與動畫用 base.css 的 .skeleton、.card、.control。 -->
    <style>
      html { background: #0D1117; }
      .boot-header { position: sticky; top: 0; z-index: 35; background: var(--color-page); height: 80px; border-bottom: 2px solid var(--color-primary); }
      .boot-header > div { position: relative; height: 100%; max-width: 1440px; margin: 0 auto; padding: 0 32px; display: flex; align-items: center; }
      .control.boot-account { padding: 0 12px; font-weight: 700; font-size: 14px; }
      .boot-tabs { position: absolute; right: 32px; bottom: 0; display: flex; gap: 20px; padding: 0 12px; }
      .boot-tabs > span { padding: 8px 24px; border-radius: 12px 12px 0 0; font-size: 14px; font-weight: 700; color: var(--color-text); }
      .boot-tabs > .on { background: var(--color-primary); color: var(--color-card); }
      .boot-tabs > span { position: relative; }
      .boot-tabs svg { position: absolute; bottom: 0; display: none; fill: var(--color-primary); }
      .boot-tabs .l { left: -12px; } .boot-tabs .r { right: -12px; }
      .boot-tabs > .on svg { display: block; }
      .boot-main { max-width: 1440px; margin: 0 auto; padding: 32px 32px 0; display: flex; flex-direction: column; gap: 24px; }
      .boot-row { display: flex; gap: 16px; align-items: center; }
      .boot-summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
      .boot-summary .card { display: flex; flex-direction: column; gap: 12px; }
      .boot-label { height: 19px; display: flex; align-items: center; }
      .boot-content { display: grid; grid-template-columns: minmax(0, 912fr) minmax(0, 448fr); gap: 16px; align-items: start; }
      .boot-list { display: flex; flex-direction: column; gap: 24px; }
      .boot-day { display: flex; flex-direction: column; gap: 8px; }
      .boot-day-head { display: flex; justify-content: space-between; height: 21px; align-items: center; }
      .boot-item { display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 4px 0; }
      .boot-item > .desc { flex: 1; min-width: 0; }
      .boot-item > .wallet { width: 230px; flex-shrink: 0; }
      .boot-item > .amount { min-width: 150px; display: flex; justify-content: flex-end; }
      .boot-cats { display: flex; flex-direction: column; gap: 32px; }
      .boot-cats > div { display: flex; flex-direction: column; gap: 16px; }
      .boot-cat { display: flex; flex-direction: column; gap: 8px; }
      .boot-cat > div { display: flex; align-items: center; gap: 10px; height: 21px; }
      @media (max-width: 1100px) { .boot-content { grid-template-columns: 1fr; } .boot-hide-md { display: none; } }
      .boot-show-sm, .boot-compact, .boot-nav { display: none; }
      /* 手機：頁首只留帳戶選單、搜尋＋篩選鈕、期間列撐滿、精簡摘要、不顯示分類加總、底部導覽 */
      @media (max-width: 760px) {
        .boot-header { height: 64px; border-bottom: 1px solid var(--color-line); }
        .boot-header > div { padding: 0 16px; }
        .boot-tabs, .boot-summary, .boot-cats { display: none; }
        .boot-main { padding: 16px 16px 0; }
        .boot-search { flex: 1; width: auto !important; }
        .boot-hide-sm, .boot-item > .wallet { display: none; } .boot-item > .amount { min-width: 0; }
        span.boot-show-sm { display: inline-block; } div.boot-show-sm { display: flex; }
        .boot-compact { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }
        .boot-compact > div { display: flex; flex-direction: column; gap: 8px; }
        .boot-compact > .r { align-items: flex-end; }
        .boot-nav { display: block; position: fixed; left: 0; right: 0; bottom: 0; z-index: 35; height: calc(64px + env(safe-area-inset-bottom)); background: var(--color-card); border-top: 1px solid var(--color-line); }
      }
    </style>
    <title>記帳</title>
  </head>
  <body>
    <div id="app" aria-busy="true">

t="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M0 0C0 6.627 5.373 12 12 12H0V0Z"/></svg></span><span data-path="/stats">統計<svg class="l" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M12 0C12 6.627 6.627 12 0 12H12V0Z"/></svg><svg class="r" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M0 0C0 6.627 5.373 12 12 12H0V0Z"/></svg></span><span data-path="/manage">管理<svg class="l" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M12 0C12 6.627 6.627 12 0 12H12V0Z"/></svg><svg class="r" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M0 0C0 6.627 5.373 12 12 12H0V0Z"/></svg></span><span data-path="/settings">設定<svg class="l" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M12 0C12 6.627 6.627 12 0 12H12V0Z"/></svg><svg class="r" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M0 0C0 6.627 5.373 12 12 12H0V0Z"/></svg></span></div></div></div>
      <div class="boot-main">
        <div class="boot-row"><span class="skeleton boot-search" style="width:448px;height:48px;border-radius:8px"></span><span class="skeleton boot-show-sm" style="width:48px;height:48px;border-radius:8px"></span><span class="boot-hide-sm boot-row"><span class="skeleton" style="width:94px;height:48px;border-radius:8px"></span><span class="skeleton" style="width:94px;height:48px;border-radius:8px"></span><span class="skeleton" style="width:66px;height:48px;border-radius:8px"></span></span><span class="boot-hide-sm" style="flex:1"></span><span class="boot-hide-md"><span class="skeleton" style="width:316px;height:44px;border-radius:12px"></span></span></div>
        <div class="boot-row boot-show-sm"><span class="skeleton" style="flex:1;height:48px;border-radius:8px"></span></div>
        <div class="boot-compact"><div><span class="skeleton" style="width:160px;height:32px;border-radius:8px"></span><span class="skeleton" style="width:40px;height:14px;border-radius:8px"></span></div><div class="r"><span class="skeleton" style="width:110px;height:16px;border-radius:8px"></span><span class="skeleton" style="width:110px;height:16px;border-radius:8px"></span></div></div>
        <div class="boot-summary"><div class="card"><div class="boot-label"><span class="skeleton" style="width:40px;height:16px;border-radius:8px"></span></div><span class="skeleton" style="width:55%;height:38px;border-radius:8px"></span></div><div class="card"><div class="boot-label"><span class="skeleton" style="width:40px;height:16px;border-radius:8px"></span></div><span class="skeleton" style="width:55%;height:38px;border-radius:8px"></span></div><div class="card"><div class="boot-label"><span class="skeleton" style="width:40px;height:16px;border-radius:8px"></span></div><span class="skeleton" style="width:55%;height:38px;border-radius:8px"></span></div></div>
        <div class="boot-content">
          <div class="card boot-list"><div class="boot-day"><div class="boot-day-head"><span class="skeleton" style="width:72px;height:14px;border-radius:8px"></span><span class="skeleton" style="width:64px;height:14px;border-radius:8px"></span></div><div class="boot-item"><span class="skeleton" style="width:40px;height:40px;border-radius:12px"></span><span class="desc"><span class="skeleton" style="width:46%;height:16px;border-radius:8px"></span></span><span class="wallet"><span class="skeleton" style="width:72px;height:24px;border-radius:6px"></span></span><span class="amount"><span class="skeleton" style="width:88px;height:16px;border-radius:8px"></span></span></div><div class="boot-item"><span class="skeleton" style="width:40px;height:40px;border-radius:12px"></span><span class="desc"><span class="skeleton" style="width:30%;height:16px;border-radius:8px"></span></span><span class="wallet"><span class="skeleton" style="width:72px;height:24px;border-radius:6px"></span></span><span class="amount"><span class="skeleton" style="width:88px;height:16px;border-radius:8px"></span></span></div><div class="boot-item"><span class="skeleton" style="width:40px;height:40px;border-radius:12px"></span><span class="desc"><span class="skeleton" style="width:38%;height:16px;border-radius:8px"></span></span><span class="wallet"><span class="skeleton" style="width:72px;height:24px;border-radius:6px"></span></span><span class="amount"><span class="skeleton" style="width:88px;height:16px;border-radius:8px"></span></span></div></div><div class="boot-day"><div class="boot-day-head"><span class="skeleton" style="width:72px;height:14px;border-radius:8px"></span><span class="skeleton" style="width:64px;height:14px;border-radius:8px"></span></div><div class="boot-item"><span class="skeleton" style="width:40px;height:40px;border-radius:12px"></span><span class="desc"><span class="skeleton" style="width:34%;height:16px;border-radius:8px"></span></span><span class="wallet"><span class="skeleton" style="width:72px;height:24px;border-radius:6px"></span></span><span class="amount"><span class="skeleton" style="width:88px;height:16px;border-radius:8px"></span></span></div><div class="boot-item"><span class="skeleton" style="width:40px;height:40px;border-radius:12px"></span><span class="desc"><span class="skeleton" style="width:42%;height:16px;border-radius:8px"></span></span><span class="wallet"><span class="skeleton" style="width:72px;height:24px;border-radius:6px"></span></span><span class="amount"><span class="skeleton" style="width:88px;height:16px;border-radius:8px"></span></span></div></div></div>
          <div class="card boot-cats"><div><span class="skeleton" style="width:40px;height:19px;border-radius:8px"></span><div class="boot-cat"><div><span class="skeleton" style="width:18px;height:18px;border-radius:6px"></span><span style="flex:1"><span class="skeleton" style="width:56px;height:14px;border-radius:8px"></span></span><span class="skeleton" style="width:72px;height:14px;border-radius:8px"></span></div><span class="skeleton" style="width:100%;height:6px;border-radius:999px"></span></div><div class="boot-cat"><div><span class="skeleton" style="width:18px;height:18px;border-radius:6px"></span><span style="flex:1"><span class="skeleton" style="width:56px;height:14px;border-radius:8px"></span></span><span class="skeleton" style="width:72px;height:14px;border-radius:8px"></span></div><span class="skeleton" style="width:72%;height:6px;border-radius:999px"></span></div><div class="boot-cat"><div><span class="skeleton" style="width:18px;height:18px;border-radius:6px"></span><span style="flex:1"><span class="skeleton" style="width:56px;height:14px;border-radius:8px"></span></span><span class="skeleton" style="width:72px;height:14px;border-radius:8px"></span></div><span class="skeleton" style="width:48%;height:6px;border-radius:999px"></span></div></div><div><span class="skeleton" style="width:40px;height:19px;border-radius:8px"></span><div class="boot-cat"><div><span class="skeleton" style="width:18px;height:18px;border-radius:6px"></span><span style="flex:1"><span class="skeleton" style="width:56px;height:14px;border-radius:8px"></span></span><span class="skeleton" style="width:72px;height:14px;border-radius:8px"></span></div><span class="skeleton" style="width:100%;height:6px;border-radius:999px"></span></div></div></div>
        </div>
      </div>
      <div class="boot-nav" aria-hidden="true"></div>
    </div>
    <script>
      // 目前頁籤；骨架的光對齊文件時間軸 0，Vue 接手後的骨架才會接續同一道光
      (function () {
        var path = (location.hash.replace(/^#/, '').split('?')[0] || '/').replace(/\/$/, '') || '/'
        document.querySelectorAll('.boot-tabs > span').forEach(function (t) { if (t.dataset.path === path) t.className = 'on' })
        requestAnimationFrame(function () { try { document.getAnimations().forEach(function (a) { a.startTime = 0 }) } catch (e) {} })
      })()
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
